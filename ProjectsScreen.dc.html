<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/modernist-3270be51-2277-458c-bede-3d5623dd6fa7/styles.css">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;800&display=swap">
<script src="_ds/modernist-3270be51-2277-458c-bede-3d5623dd6fa7/_ds_bundle.js"></script>
<script src="flow.js"></script>
<style>:root{--font-body:"Archivo","Noto Sans Thai",system-ui,sans-serif;--font-heading:"Archivo","Noto Sans Thai",system-ui,sans-serif}</style>
</helmet>
<div style="height:100%;position:relative;overflow:hidden;display:flex;flex-direction:column;background:var(--color-bg);color:var(--color-text);font-family:var(--font-body)">

  <header style="flex:none;display:flex;align-items:center;gap:6px;padding:10px 14px;border-bottom:2px solid var(--color-divider);background:var(--color-bg)">
    <button onClick="{{ back }}" aria-label="ย้อนกลับ" style="width:44px;height:44px;margin-left:-10px;display:flex;align-items:center;justify-content:center;background:transparent;border:0;cursor:pointer;color:var(--color-text)">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="square"><path d="M15 5l-7 7 7 7"></path></svg>
    </button>
    <div style="flex:1;min-width:0;font-family:var(--font-heading);font-weight:800;font-size:15px;letter-spacing:-0.01em;line-height:1.1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">โครงการทั้งหมด</div>
  </header>

  <div style="flex:1;overflow:auto;padding:16px 16px 20px">
    <div class="seg" style="display:flex;width:100%">
      <sc-for list="{{ filters }}" as="f" hint-placeholder-count="4">
        <label class="seg-opt" style="flex:1;justify-content:center;padding:9px 6px;font-size:12.5px">
          <input type="radio" name="projectFilter" checked="{{ f.checked }}" onChange="{{ f.pick }}">
          <span>{{ f.label }}</span>
        </label>
      </sc-for>
    </div>

    <div style="display:flex;align-items:baseline;justify-content:space-between;border-bottom:2px solid var(--color-divider);padding-bottom:8px;margin-top:20px">
      <h6 style="margin:0;font-size:12px;letter-spacing:0.04em">{{ listLabel }}</h6>
      <span style="font-family:var(--font-heading);font-weight:800;font-size:12px">{{ countLabel }}</span>
    </div>

    <sc-for list="{{ projects }}" as="p" hint-placeholder-count="6">
      <button onClick="{{ p.open }}" style="width:100%;display:block;text-align:left;margin-top:10px;padding:14px;background:var(--color-bg);border:2px solid var(--color-divider);cursor:pointer;color:var(--color-text);font-family:var(--font-body)">
        <span style="display:flex;align-items:flex-start;gap:10px">
          <span style="flex:1;min-width:0">
            <span style="display:block;font-family:var(--font-heading);font-weight:800;font-size:16px;line-height:1.3;letter-spacing:-0.01em">{{ p.name }}</span>
            <span style="display:block;font-size:12px;line-height:1.55;margin-top:4px;color:color-mix(in srgb, var(--color-text) 55%, transparent)">{{ p.meta }}</span>
          </span>
          <span class="tag {{ p.tagClass }}" style="flex:none;font-size:11px">{{ p.status }}</span>
        </span>

        <span style="display:flex;align-items:center;gap:10px;margin-top:12px">
          <span style="flex:1;height:6px;background:var(--color-neutral-300);display:block">
            <span style="display:block;height:6px;width:{{ p.pct }};background:{{ p.barColor }}"></span>
          </span>
          <span style="flex:none;font-family:var(--font-heading);font-weight:800;font-size:12px;min-width:34px;text-align:right">{{ p.pct }}</span>
        </span>

        <span style="display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-top:8px;font-size:11.5px;line-height:1.5;color:color-mix(in srgb, var(--color-text) 55%, transparent)">
          <span>{{ p.docs }}</span>
          <span>{{ p.updated }}</span>
        </span>
      </button>
    </sc-for>
  </div>

  <div style="flex:none;border-top:2px solid var(--color-divider);padding:12px 16px;background:var(--color-bg)">
    <button onClick="{{ toNewProject }}" class="btn btn-primary" style="width:100%;justify-content:flex-start;height:52px;font-size:16px;padding-inline:16px;gap:10px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="square"><path d="M12 5v14M5 12h14"></path></svg>สร้างโครงการ</button>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { filter: 'all' };

  renderVals() {
    /* Newest first — Home shows the first three of this same list. */
    const projects = [
      { name: 'โครงการจัดซื้ออุปกรณ์วิทยาศาสตร์', code: 'SCI-2026-024', owner: 'ครูเบญจมาศ',
        docs: '12 เอกสาร', pct: '68%', status: 'กำลังดำเนินการ', tone: 'active', updated: 'อัปเดต 15/08/2026' },
      { name: 'โครงการซ่อมบำรุงอาคารเรียน', code: 'BLD-2026-011', owner: 'ครูสมชาย',
        docs: '8 เอกสาร', pct: '45%', status: 'รอตรวจสอบ', tone: 'wait', updated: 'อัปเดต 12/08/2026' },
      { name: 'โครงการจัดซื้อวัสดุสำนักงาน', code: 'OFF-2026-007', owner: 'ครูมาลี',
        docs: '15 เอกสาร', pct: '100%', status: 'เสร็จสิ้น', tone: 'done', updated: 'อัปเดต 05/08/2026' },
      { name: 'โครงการพัฒนาห้องสมุดโรงเรียน', code: 'LIB-2026-005', owner: 'ครูวิภา',
        docs: '10 เอกสาร', pct: '72%', status: 'กำลังดำเนินการ', tone: 'active', updated: 'อัปเดต 28/07/2026' },
      { name: 'โครงการอาหารกลางวันนักเรียน', code: 'FOD-2026-003', owner: 'ครูสุนีย์',
        docs: '21 เอกสาร', pct: '100%', status: 'เสร็จสิ้น', tone: 'done', updated: 'อัปเดต 20/07/2026' },
      { name: 'โครงการจัดซื้อครุภัณฑ์ห้องคอมพิวเตอร์', code: 'COM-2026-002', owner: 'ครูอนันต์',
        docs: '6 เอกสาร', pct: '30%', status: 'รอตรวจสอบ', tone: 'wait', updated: 'อัปเดต 12/07/2026' },
    ];
    const TAG = { active: 'tag-accent-2', wait: 'tag-outline', done: 'tag-neutral' };
    const BAR = { active: 'var(--color-accent)', wait: 'var(--color-accent-2)', done: 'var(--color-text)' };

    /* The filter is resolved here, not in the template — the runtime has no
       comparisons, so <sc-for> only ever receives the finished list. */
    const FILTERS = [
      { id: 'all',    label: 'ทั้งหมด',   title: 'โครงการทั้งหมด' },
      { id: 'active', label: 'ดำเนินการ', title: 'กำลังดำเนินการ' },
      { id: 'wait',   label: 'รอตรวจ',    title: 'รอตรวจสอบ' },
      { id: 'done',   label: 'เสร็จสิ้น',  title: 'เสร็จสิ้นแล้ว' },
    ];
    const current = FILTERS.find(f => f.id === this.state.filter) || FILTERS[0];
    const shown = current.id === 'all' ? projects : projects.filter(p => p.tone === current.id);

    return {
      back: () => go('home'),
      filters: FILTERS.map(f => ({
        label: f.label,
        checked: f.id === current.id,
        pick: () => this.setState({ filter: f.id }),
      })),
      listLabel: current.title,
      countLabel: shown.length + ' โครงการ',
      projects: shown.map(p => ({
        ...p,
        meta: p.code + ' · ' + p.owner,
        tagClass: TAG[p.tone],
        barColor: BAR[p.tone],
        open: () => go('project'),
      })),
      toNewProject: () => go('newProject'),
    };
  }
}
</script>
</body>
</html>
