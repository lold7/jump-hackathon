<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/modernist-3270be51-2277-458c-bede-3d5623dd6fa7/styles.css">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;800&display=swap">
<script src="_ds/modernist-3270be51-2277-458c-bede-3d5623dd6fa7/_ds_bundle.js"></script>
<script src="flow.js"></script>
<style>:root{--font-body:"Archivo","Noto Sans Thai",system-ui,sans-serif;--font-heading:"Archivo","Noto Sans Thai",system-ui,sans-serif}</style>
</helmet>
<div style="height:100%;position:relative;overflow:hidden;display:flex;flex-direction:column;background:var(--color-bg);color:var(--color-text);font-family:var(--font-body)">

  <header style="flex:none;display:flex;align-items:center;gap:6px;padding:10px 14px;border-bottom:2px solid var(--color-divider);background:var(--color-bg)">
    <button onClick="{{ back }}" aria-label="ย้อนกลับ" style="width:44px;height:44px;margin-left:-10px;display:flex;align-items:center;justify-content:center;background:transparent;border:0;cursor:pointer;color:var(--color-text)">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="square"><path d="M15 5l-7 7 7 7"></path></svg>
    </button>
    <div style="flex:1;min-width:0;font-family:var(--font-heading);font-weight:800;font-size:15px;letter-spacing:-0.01em;line-height:1.1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">รายละเอียดโครงการ</div>
    <button onClick="{{ openMore }}" aria-label="ตัวเลือกเพิ่มเติม" style="width:44px;height:44px;margin-right:-10px;display:flex;align-items:center;justify-content:center;background:transparent;border:0;cursor:pointer;color:var(--color-text)">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="square"><path d="M12 5h.01M12 12h.01M12 19h.01"></path></svg>
    </button>
  </header>

  <div style="flex:1;overflow:auto;padding:20px 16px 20px">
    <div style="display:flex;align-items:flex-start;gap:10px">
      <h1 style="flex:1;min-width:0;font-size:23px;line-height:1.26;letter-spacing:-0.01em;margin:0;text-wrap:pretty">โครงการจัดซื้ออุปกรณ์วิทยาศาสตร์</h1>
      <span class="tag tag-accent-2" style="flex:none;font-size:11px;margin-top:4px">กำลังดำเนินการ</span>
    </div>
    <p style="font-size:13px;line-height:1.6;margin:6px 0 18px;color:color-mix(in srgb, var(--color-text) 55%, transparent)">SCI-2026-024 · ครูเบญจมาศ</p>

    <div style="display:flex;align-items:center;gap:10px">
      <span style="flex:1;height:8px;background:var(--color-neutral-300);display:block">
        <span style="display:block;height:8px;width:68%;background:var(--color-accent)"></span>
      </span>
      <span style="flex:none;font-family:var(--font-heading);font-weight:800;font-size:15px">68%</span>
    </div>

    <div style="margin-top:22px">
      <div style="display:flex;align-items:baseline;justify-content:space-between;border-bottom:2px solid var(--color-divider);padding-bottom:8px">
        <h6 style="margin:0;font-size:12px;letter-spacing:0.04em">ข้อมูลโครงการ</h6>
        <span style="font-family:var(--font-heading);font-weight:800;font-size:12px">9 รายการ</span>
      </div>
      <sc-for list="{{ info }}" as="f" hint-placeholder-count="9">
        <div style="display:flex;align-items:baseline;gap:12px;padding:11px 0;border-bottom:1px solid color-mix(in srgb, var(--color-text) 18%, transparent)">
          <span style="width:118px;flex:none;font-size:12px;line-height:1.5;color:color-mix(in srgb, var(--color-text) 70%, transparent)">{{ f.label }}</span>
          <span style="flex:1;min-width:0;font-size:14px;font-weight:600;line-height:1.45;text-align:right">{{ f.value }}</span>
        </div>
      </sc-for>
      <div style="display:flex;align-items:baseline;justify-content:space-between;border-top:2px solid var(--color-text);padding-top:12px;margin-top:2px">
        <span style="min-width:0">
          <span style="display:block;font-family:var(--font-heading);font-weight:800;font-size:15px">คงเหลือ</span>
          <span style="display:block;font-size:12px;line-height:1.5;margin-top:3px;color:color-mix(in srgb, var(--color-text) 55%, transparent)">จากงบประมาณ ฿360,000</span>
        </span>
        <span style="font-family:var(--font-heading);font-weight:800;font-size:24px;letter-spacing:-0.015em">฿113,500</span>
      </div>
    </div>

    <div style="margin-top:26px">
      <div style="display:flex;align-items:baseline;justify-content:space-between;border-bottom:2px solid var(--color-divider);padding-bottom:8px">
        <h6 style="margin:0;font-size:12px;letter-spacing:0.04em">เอกสารในโครงการ</h6>
        <span style="font-family:var(--font-heading);font-weight:800;font-size:12px">{{ docCountLabel }}</span>
      </div>
      <sc-for list="{{ docs }}" as="d" hint-placeholder-count="5">
        <button onClick="{{ d.open }}" style="width:100%;display:flex;align-items:center;gap:12px;padding:12px 0;background:transparent;border:0;border-bottom:1px solid color-mix(in srgb, var(--color-text) 18%, transparent);cursor:pointer;text-align:left;color:var(--color-text);font-family:var(--font-body)">
          <span style="width:40px;height:52px;flex:none;background:var(--color-neutral-200);border:1px solid var(--color-divider);display:flex;align-items:center;justify-content:center;color:var(--color-neutral-700);font-family:var(--font-heading);font-weight:800;font-size:9px">{{ d.ext }}</span>
          <span style="flex:1;min-width:0">
            <span style="display:block;font-size:14px;font-weight:600;line-height:1.4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ d.type }}</span>
            <span style="display:block;font-size:12px;line-height:1.5;margin-top:2px;color:color-mix(in srgb, var(--color-text) 55%, transparent)">{{ d.meta }}</span>
            <span style="display:block;font-size:12px;line-height:1.5;color:{{ d.stateColor }}">{{ d.state }}</span>
          </span>
          <span class="tag {{ d.tagClass }}" style="flex:none;font-size:11px">{{ d.tag }}</span>
        </button>
      </sc-for>
    </div>
  </div>

  <div style="flex:none;border-top:2px solid var(--color-divider);padding:12px 16px;background:var(--color-bg);display:flex;flex-direction:column;gap:8px">
    <button onClick="{{ toScan }}" class="btn btn-primary" style="width:100%;justify-content:flex-start;height:52px;font-size:16px;padding-inline:16px;gap:10px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="square"><path d="M12 5v14M5 12h14"></path></svg>อัปโหลดเอกสาร</button>
    <button onClick="{{ toSchedule }}" class="btn btn-secondary" style="width:100%;justify-content:flex-start;height:48px;font-size:15px;padding-inline:16px">ดูภาพรวมโครงการ</button>
  </div>

  <nav aria-label="เมนูหลัก" style="flex:none;display:flex;border-top:2px solid var(--color-text);background:var(--color-bg)">
    <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="3">
      <button onClick="{{ t.go }}" aria-label="{{ t.aria }}" aria-current="{{ t.current }}" style="flex:1;height:62px;margin-top:-2px;border:0;border-top:2px solid {{ t.rule }};background:transparent;cursor:pointer;color:{{ t.color }};display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-family:var(--font-heading);font-weight:800;font-size:11px;letter-spacing:0.02em">
        <sc-if value="{{ t.isHome }}" hint-placeholder-val="{{ true }}">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M3 11l9-7 9 7v9H3z"></path><path d="M10 20v-6h4v6"></path></svg>
        </sc-if>
        <sc-if value="{{ t.isSchedule }}" hint-placeholder-val="{{ false }}">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M3 5h18v16H3z"></path><path d="M3 10h18"></path><path d="M8 3v4M16 3v4"></path></svg>
        </sc-if>
        <sc-if value="{{ t.isProfile }}" hint-placeholder-val="{{ false }}">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><circle cx="12" cy="8" r="4"></circle><path d="M4 20c0-3.6 3.6-6 8-6s8 2.4 8 6"></path></svg>
        </sc-if>
        <span>{{ t.label }}</span>
      </button>
    </sc-for>
  </nav>

  <sc-if value="{{ moreOpen }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;inset:0;z-index:50;background:color-mix(in srgb, #201e1d 45%, transparent);display:flex;flex-direction:column;justify-content:flex-end">
      <div style="background:var(--color-bg);border-top:2px solid var(--color-text);display:flex;flex-direction:column">
        <div style="flex:none;display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:2px solid var(--color-divider)">
          <div style="font-family:var(--font-heading);font-weight:800;font-size:17px">ตัวเลือกโครงการ</div>
          <button onClick="{{ closeAll }}" aria-label="ปิด" style="width:44px;height:44px;margin-right:-10px;background:transparent;border:0;cursor:pointer;color:var(--color-text);display:flex;align-items:center;justify-content:center">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="square"><path d="M5 5l14 14M19 5L5 19"></path></svg>
          </button>
        </div>
        <sc-for list="{{ moreItems }}" as="m" hint-placeholder-count="3">
          <button onClick="{{ m.go }}" style="width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:17px 16px;background:transparent;border:0;border-bottom:1px solid color-mix(in srgb, var(--color-text) 18%, transparent);cursor:pointer;text-align:left;font-family:var(--font-heading);font-weight:800;font-size:16px;line-height:1.4;color:var(--color-text)">
            <span>{{ m.label }}</span>
            <span style="font-size:12px;font-family:var(--font-body);font-weight:400;color:color-mix(in srgb, var(--color-text) 55%, transparent)">{{ m.note }}</span>
          </button>
        </sc-for>
        <div style="flex:none;padding:12px 16px;border-top:2px solid var(--color-divider)">
          <button onClick="{{ closeAll }}" class="btn btn-secondary" style="width:100%;justify-content:flex-start;height:48px;font-size:15px;padding-inline:16px">ปิด</button>
        </div>
      </div>
    </div>
  </sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { moreOpen: false };

  tabsFor(here) {
    const T = [
      { key: 'home',     label: 'หน้าแรก',  aria: 'หน้าแรก' },
      { key: 'schedule', label: 'ตารางงาน', aria: 'ตารางงานของโครงการ' },
      { key: 'profile',  label: 'โปรไฟล์',  aria: 'บัญชีของฉัน' },
    ];
    return T.map(t => ({
      ...t,
      isHome: t.key === 'home',
      isSchedule: t.key === 'schedule',
      isProfile: t.key === 'profile',
      current: t.key === here ? 'page' : undefined,
      rule:  t.key === here ? 'var(--color-accent)' : 'transparent',
      color: t.key === here ? 'var(--color-accent-700)' : 'color-mix(in srgb, var(--color-text) 55%, transparent)',
      go: () => go(t.key),
    }));
  }

  renderVals() {
    const info = [
      { label: 'ชื่อโครงการ',        value: 'จัดซื้ออุปกรณ์วิทยาศาสตร์' },
      { label: 'รหัสโครงการ',        value: 'SCI-2026-024' },
      { label: 'ผู้รับผิดชอบ',        value: 'ครูเบญจมาศ' },
      { label: 'แหล่งที่มาของเงิน',   value: 'เงินอุดหนุน' },
      { label: 'งบประมาณ',           value: '฿360,000' },
      { label: 'ใช้ไปแล้ว',           value: '฿246,500' },
      { label: 'จำนวนครั้งที่เบิกจ่าย', value: '3 ครั้ง' },
      { label: 'วันที่เริ่มต้น',       value: '10/08/2026' },
      { label: 'วันที่สิ้นสุด',        value: '02/09/2026' },
    ];

    /* tone drives the right-hand tag: ok = passed AI + validation,
       warn = AI done but a field still needs a human, wait = not read yet. */
    const docs = [
      { type: 'ใบเสร็จ',        ext: 'JPG', meta: 'DOC-0012 · อัปโหลด 15/08/2026', state: 'AI อ่านแล้ว · รอยืนยัน 1 ช่อง', tone: 'warn', tag: 'ต้องตรวจ' },
      { type: 'ใบสำคัญรับเงิน', ext: 'JPG', meta: 'DOC-0011 · อัปโหลด 14/08/2026', state: 'AI อ่านแล้ว · ตรวจสอบผ่าน',    tone: 'ok',   tag: 'ผ่าน' },
      { type: 'ใบเสร็จ',        ext: 'JPG', meta: 'DOC-0010 · อัปโหลด 13/08/2026', state: 'AI อ่านแล้ว · ตรวจสอบผ่าน',    tone: 'ok',   tag: 'ผ่าน' },
      { type: 'ใบส่งของ',       ext: 'PNG', meta: 'DOC-0009 · อัปโหลด 13/08/2026', state: 'AI อ่านแล้ว · ตรวจสอบผ่าน',    tone: 'ok',   tag: 'ผ่าน' },
      { type: 'ใบเสนอราคา',     ext: 'PDF', meta: 'DOC-0002 · อัปโหลด 08/08/2026', state: 'AI อ่านแล้ว · ตรวจสอบผ่าน',    tone: 'ok',   tag: 'ผ่าน' },
    ];
    const TAG   = { ok: 'tag-neutral', warn: 'tag-accent', wait: 'tag-outline' };
    const STATE = { ok: 'color-mix(in srgb, var(--color-text) 55%, transparent)', warn: 'var(--color-accent-700)', wait: 'color-mix(in srgb, var(--color-text) 55%, transparent)' };

    const more = [
      { label: 'แก้ไขโครงการ',      note: '',              to: 'newProject' },
      { label: 'ส่งออกข้อมูล',      note: '12 เอกสาร',      to: 'export' },
      { label: 'ดูภาพรวมโครงการ',   note: '2 / 6 ขั้นตอน',  to: 'schedule' },
    ];

    return {
      tabs: this.tabsFor('home'),
      back: () => go('home'),
      info,
      docCountLabel: '12 เอกสาร',
      docs: docs.map(d => ({
        ...d,
        tagClass: TAG[d.tone],
        stateColor: STATE[d.tone],
        open: () => go('review'),
      })),
      moreOpen: this.state.moreOpen,
      moreItems: more.map(m => ({ label: m.label, note: m.note, go: () => go(m.to) })),
      openMore: () => this.setState({ moreOpen: true }),
      closeAll: () => this.setState({ moreOpen: false }),
      toScan: () => go('scan'),
      toSchedule: () => go('schedule'),
    };
  }
}
</script>
</body>
</html>
