<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/modernist-3270be51-2277-458c-bede-3d5623dd6fa7/styles.css">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;800&display=swap">
<script src="_ds/modernist-3270be51-2277-458c-bede-3d5623dd6fa7/_ds_bundle.js"></script>
<script src="flow.js"></script>
<style>:root{--font-body:"Archivo","Noto Sans Thai",system-ui,sans-serif;--font-heading:"Archivo","Noto Sans Thai",system-ui,sans-serif}</style>
</helmet>
<div style="height:100%;position:relative;overflow:hidden;display:flex;flex-direction:column;background:var(--color-bg);color:var(--color-text);font-family:var(--font-body)">

  <header style="flex:none;display:flex;align-items:center;gap:6px;padding:10px 14px;border-bottom:2px solid var(--color-divider);background:var(--color-bg)">
    <div style="flex:1;font-family:var(--font-heading);font-weight:800;font-size:17px;letter-spacing:-0.01em;line-height:1.1">Kru<span style="color:var(--color-accent-700)">Scan</span></div>
    <button onClick="{{ openAlerts }}" aria-label="การแจ้งเตือน" style="width:44px;height:44px;position:relative;display:flex;align-items:center;justify-content:center;background:transparent;border:0;cursor:pointer;color:var(--color-text)">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="square"><path d="M6 9a6 6 0 0112 0v5l2 3H4l2-3z"></path><path d="M10 20h4"></path></svg>
      <span style="position:absolute;top:7px;right:8px;width:8px;height:8px;background:var(--color-accent)"></span>
    </button>
  </header>

  <div style="flex:1;overflow:auto;padding:20px 16px 24px">
    <h1 style="font-size:25px;line-height:1.24;letter-spacing:-0.01em;margin:0 0 6px;text-wrap:pretty">สวัสดี ครูเบญจมาศ</h1>
    <p style="font-size:13.5px;line-height:1.6;margin:0 0 20px;color:color-mix(in srgb, var(--color-text) 62%, transparent)">โรงเรียนตัวอย่าง · ปีงบประมาณ 2569</p>

    <div style="display:flex;gap:10px">
      <div style="flex:1;border:2px solid var(--color-accent);padding:12px 12px 11px">
        <div style="font-family:var(--font-heading);font-weight:800;font-size:30px;line-height:1;color:var(--color-accent-700)">6</div>
        <div style="font-size:12px;line-height:1.5;margin-top:6px;color:color-mix(in srgb, var(--color-text) 62%, transparent)">เอกสารรอตรวจสอบ</div>
      </div>
      <div style="flex:1;border:2px solid var(--color-divider);padding:12px 12px 11px">
        <div style="font-family:var(--font-heading);font-weight:800;font-size:30px;line-height:1">฿246,500</div>
        <div style="font-size:12px;line-height:1.5;margin-top:6px;color:color-mix(in srgb, var(--color-text) 62%, transparent)">ยอดใช้จ่ายเดือนนี้</div>
      </div>
    </div>

    <button onClick="{{ toNewProject }}" class="btn btn-primary" style="width:100%;justify-content:flex-start;height:52px;font-size:16px;padding-inline:16px;gap:10px;margin-top:20px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="square"><path d="M12 5v14M5 12h14"></path></svg>สร้างโครงการ</button>

    <div style="margin-top:26px">
      <div style="display:flex;align-items:baseline;justify-content:space-between;border-bottom:2px solid var(--color-divider);padding-bottom:8px">
        <h6 style="margin:0;font-size:12px;letter-spacing:0.04em">โครงการล่าสุด</h6>
        <span style="font-family:var(--font-heading);font-weight:800;font-size:12px">{{ countLabel }}</span>
      </div>

      <div style="display:flex;gap:10px;overflow-x:auto;margin:0 -16px;padding:12px 16px 2px">
        <sc-for list="{{ projects }}" as="p" hint-placeholder-count="3">
          <button onClick="{{ p.open }}" style="flex:none;width:254px;display:block;text-align:left;padding:14px;background:var(--color-bg);border:2px solid var(--color-divider);cursor:pointer;color:var(--color-text);font-family:var(--font-body)">
            <span style="display:block">
              <span class="tag {{ p.tagClass }}" style="font-size:11px">{{ p.status }}</span>
            </span>
            <span style="display:block;font-family:var(--font-heading);font-weight:800;font-size:16px;line-height:1.3;letter-spacing:-0.01em;margin-top:10px">{{ p.name }}</span>
            <span style="display:block;font-size:12px;line-height:1.55;margin-top:4px;color:color-mix(in srgb, var(--color-text) 55%, transparent)">{{ p.meta }}</span>

            <span style="display:flex;align-items:center;gap:10px;margin-top:12px">
              <span style="flex:1;height:6px;background:var(--color-neutral-300);display:block">
                <span style="display:block;height:6px;width:{{ p.pct }};background:{{ p.barColor }}"></span>
              </span>
              <span style="flex:none;font-family:var(--font-heading);font-weight:800;font-size:12px;min-width:34px;text-align:right">{{ p.pct }}</span>
            </span>

            <span style="display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-top:8px;font-size:11.5px;line-height:1.5;color:color-mix(in srgb, var(--color-text) 55%, transparent)">
              <span>{{ p.docs }}</span>
              <span>{{ p.updated }}</span>
            </span>
          </button>
        </sc-for>
      </div>

      <button onClick="{{ toAllProjects }}" class="btn btn-secondary" style="width:100%;justify-content:space-between;height:48px;font-size:15px;padding-inline:16px;margin-top:10px">
        <span>ดูโครงการทั้งหมด</span>
        <span style="display:flex;align-items:center;gap:6px;font-family:var(--font-body);font-size:12px;font-weight:400;color:color-mix(in srgb, var(--color-text) 55%, transparent)">{{ totalLabel }}
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--color-text)" stroke-width="2.2" stroke-linecap="square"><path d="M9 6l6 6-6 6"></path></svg>
        </span>
      </button>
    </div>

    <div style="margin-top:24px">
      <div style="display:flex;align-items:baseline;justify-content:space-between;border-bottom:2px solid var(--color-divider);padding-bottom:8px">
        <h6 style="margin:0;font-size:12px;letter-spacing:0.04em">งานที่ต้องทำ</h6>
        <span style="font-family:var(--font-heading);font-weight:800;font-size:12px">2 รายการ</span>
      </div>
      <sc-for list="{{ tasks }}" as="t" hint-placeholder-count="2">
        <button onClick="{{ t.open }}" style="width:100%;display:flex;align-items:center;gap:12px;padding:13px 0;background:transparent;border:0;border-bottom:1px solid color-mix(in srgb, var(--color-text) 18%, transparent);cursor:pointer;text-align:left;color:var(--color-text);font-family:var(--font-body)">
          <span style="width:4px;height:38px;flex:none;background:{{ t.bar }}"></span>
          <span style="flex:1;min-width:0">
            <span style="display:block;font-size:14px;font-weight:600;line-height:1.4">{{ t.label }}</span>
            <span style="display:block;font-size:12px;line-height:1.5;margin-top:2px;color:color-mix(in srgb, var(--color-text) 55%, transparent)">{{ t.meta }}</span>
          </span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--color-neutral-700)" stroke-width="2.2" stroke-linecap="square" style="flex:none"><path d="M9 6l6 6-6 6"></path></svg>
        </button>
      </sc-for>
    </div>
  </div>

  <nav aria-label="เมนูหลัก" style="flex:none;display:flex;border-top:2px solid var(--color-text);background:var(--color-bg)">
    <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="3">
      <button onClick="{{ t.go }}" aria-label="{{ t.aria }}" aria-current="{{ t.current }}" style="flex:1;height:62px;margin-top:-2px;border:0;border-top:2px solid {{ t.rule }};background:transparent;cursor:pointer;color:{{ t.color }};display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-family:var(--font-heading);font-weight:800;font-size:11px;letter-spacing:0.02em">
        <sc-if value="{{ t.isHome }}" hint-placeholder-val="{{ true }}">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M3 11l9-7 9 7v9H3z"></path><path d="M10 20v-6h4v6"></path></svg>
        </sc-if>
        <sc-if value="{{ t.isSchedule }}" hint-placeholder-val="{{ false }}">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M3 5h18v16H3z"></path><path d="M3 10h18"></path><path d="M8 3v4M16 3v4"></path></svg>
        </sc-if>
        <sc-if value="{{ t.isProfile }}" hint-placeholder-val="{{ false }}">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><circle cx="12" cy="8" r="4"></circle><path d="M4 20c0-3.6 3.6-6 8-6s8 2.4 8 6"></path></svg>
        </sc-if>
        <span>{{ t.label }}</span>
      </button>
    </sc-for>
  </nav>

  <sc-if value="{{ alertsOpen }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;inset:0;z-index:50;background:color-mix(in srgb, #201e1d 45%, transparent);display:flex;flex-direction:column;justify-content:flex-end">
      <div style="background:var(--color-bg);border-top:2px solid var(--color-text);max-height:86%;display:flex;flex-direction:column">
        <div style="flex:none;display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:2px solid var(--color-divider)">
          <div style="font-family:var(--font-heading);font-weight:800;font-size:17px">การแจ้งเตือน</div>
          <button onClick="{{ closeAll }}" aria-label="ปิด" style="width:44px;height:44px;margin-right:-10px;background:transparent;border:0;cursor:pointer;color:var(--color-text);display:flex;align-items:center;justify-content:center">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="square"><path d="M5 5l14 14M19 5L5 19"></path></svg>
          </button>
        </div>
        <div style="flex:1;overflow:auto;padding:0 16px">
          <sc-for list="{{ alerts }}" as="a" hint-placeholder-count="3">
            <div style="display:flex;align-items:flex-start;gap:12px;padding:14px 0;border-bottom:1px solid color-mix(in srgb, var(--color-text) 18%, transparent)">
              <span style="width:4px;align-self:stretch;flex:none;background:{{ a.bar }}"></span>
              <span style="flex:1;min-width:0">
                <span style="display:block;font-size:14px;font-weight:600;line-height:1.45">{{ a.label }}</span>
                <span style="display:block;font-size:12px;line-height:1.55;margin-top:3px;color:color-mix(in srgb, var(--color-text) 55%, transparent)">{{ a.meta }}</span>
              </span>
            </div>
          </sc-for>
        </div>
        <div style="flex:none;padding:12px 16px;border-top:2px solid var(--color-divider)">
          <button onClick="{{ closeAll }}" class="btn btn-secondary" style="width:100%;justify-content:flex-start;height:48px;font-size:15px;padding-inline:16px">ปิด</button>
        </div>
      </div>
    </div>
  </sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { alertsOpen: false };

  /* Shared across the four app screens. `here` marks the active tab.
     All three icon flags are set on every tab — a missing one resolves to
     undefined and the runtime warns "{{ t.isX }} never resolved". */
  tabsFor(here) {
    const T = [
      { key: 'home',     label: 'หน้าแรก',  aria: 'หน้าแรก' },
      { key: 'schedule', label: 'ตารางงาน', aria: 'ตารางงานของโครงการ' },
      { key: 'profile',  label: 'โปรไฟล์',  aria: 'บัญชีของฉัน' },
    ];
    return T.map(t => ({
      ...t,
      isHome: t.key === 'home',
      isSchedule: t.key === 'schedule',
      isProfile: t.key === 'profile',
      current: t.key === here ? 'page' : undefined,
      rule:  t.key === here ? 'var(--color-accent)' : 'transparent',
      color: t.key === here ? 'var(--color-accent-700)' : 'color-mix(in srgb, var(--color-text) 55%, transparent)',
      go: () => go(t.key),
    }));
  }

  renderVals() {
    /* Home shows only the three most recent; the full six live on
       ProjectsScreen, reached through ดูโครงการทั้งหมด. */
    const TOTAL = 6;
    const projects = [
      { name: 'โครงการจัดซื้ออุปกรณ์วิทยาศาสตร์', code: 'SCI-2026-024', owner: 'ครูเบญจมาศ',
        docs: '12 เอกสาร', pct: '68%', status: 'กำลังดำเนินการ', tone: 'active', updated: 'อัปเดต 15/08/2026' },
      { name: 'โครงการซ่อมบำรุงอาคารเรียน', code: 'BLD-2026-011', owner: 'ครูสมชาย',
        docs: '8 เอกสาร', pct: '45%', status: 'รอตรวจสอบ', tone: 'wait', updated: 'อัปเดต 12/08/2026' },
      { name: 'โครงการจัดซื้อวัสดุสำนักงาน', code: 'OFF-2026-007', owner: 'ครูมาลี',
        docs: '15 เอกสาร', pct: '100%', status: 'เสร็จสิ้น', tone: 'done', updated: 'อัปเดต 05/08/2026' },
    ];
    const TAG = { active: 'tag-accent-2', wait: 'tag-outline', done: 'tag-neutral' };
    const BAR = { active: 'var(--color-accent)', wait: 'var(--color-accent-2)', done: 'var(--color-text)' };

    const tasks = [
      { label: 'ตรวจสอบข้อมูลที่ AI อ่านได้', meta: 'DOC-0012 · จำนวนความมั่นใจต่ำ 62%', bar: 'var(--color-accent)', to: 'review' },
      { label: 'ส่งออกข้อมูลโครงการวิทยาศาสตร์', meta: 'SCI-2026-024 · 12 เอกสารพร้อมส่ง', bar: 'var(--color-accent-2)', to: 'export' },
    ];

    const alerts = [
      { label: 'AI อ่านช่อง "จำนวน" ได้ไม่ชัด', meta: 'DOC-0012 · ความมั่นใจ 62% · ต้องตรวจสอบ', bar: 'var(--color-accent)' },
      { label: 'โครงการซ่อมบำรุงอาคารเรียนใกล้ครบกำหนด', meta: 'BLD-2026-011 · เหลืออีก 5 วัน', bar: 'var(--color-accent-2)' },
      { label: 'ส่งออกข้อมูลโครงการวัสดุสำนักงานเรียบร้อย', meta: 'OFF-2026-007 · 05/08/2026', bar: 'var(--color-text)' },
    ];

    return {
      tabs: this.tabsFor('home'),
      countLabel: projects.length + ' จาก ' + TOTAL + ' โครงการ',
      totalLabel: TOTAL + ' โครงการ',
      projects: projects.map(p => ({
        ...p,
        meta: p.code + ' · ' + p.owner,
        tagClass: TAG[p.tone],
        barColor: BAR[p.tone],
        open: () => go('project'),
      })),
      tasks: tasks.map(t => ({ ...t, open: () => go(t.to) })),
      alerts,
      alertsOpen: this.state.alertsOpen,
      openAlerts: () => this.setState({ alertsOpen: true }),
      closeAll: () => this.setState({ alertsOpen: false }),
      toAllProjects: () => go('projects'),
      toNewProject: () => go('newProject'),
    };
  }
}
</script>
</body>
</html>
