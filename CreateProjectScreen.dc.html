<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/modernist-3270be51-2277-458c-bede-3d5623dd6fa7/styles.css">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;800&display=swap">
<script src="_ds/modernist-3270be51-2277-458c-bede-3d5623dd6fa7/_ds_bundle.js"></script>
<script src="flow.js"></script>
<style>:root{--font-body:"Archivo","Noto Sans Thai",system-ui,sans-serif;--font-heading:"Archivo","Noto Sans Thai",system-ui,sans-serif}</style>
</helmet>
<div style="height:100%;position:relative;overflow:hidden;display:flex;flex-direction:column;background:var(--color-bg);color:var(--color-text);font-family:var(--font-body)">

  <header style="flex:none;display:flex;align-items:center;gap:6px;padding:10px 14px;border-bottom:2px solid var(--color-divider);background:var(--color-bg)">
    <button onClick="{{ back }}" aria-label="ย้อนกลับ" style="width:44px;height:44px;margin-left:-10px;display:flex;align-items:center;justify-content:center;background:transparent;border:0;cursor:pointer;color:var(--color-text)">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="square"><path d="M15 5l-7 7 7 7"></path></svg>
    </button>
    <div style="flex:1;font-family:var(--font-heading);font-weight:800;font-size:15px;letter-spacing:-0.01em;line-height:1.1">สร้างโครงการ</div>
  </header>

  <div style="flex:1;overflow:auto;padding:20px 16px 20px">
    <h1 style="font-size:25px;line-height:1.24;letter-spacing:-0.01em;margin:0 0 8px;text-wrap:pretty">สร้างโครงการใหม่</h1>
    <p style="font-size:13.5px;line-height:1.6;margin:0 0 20px;color:color-mix(in srgb, var(--color-text) 62%, transparent);text-wrap:pretty">กรอกข้อมูลโครงการ แล้วเริ่มสแกนเอกสารเข้าโครงการได้ทันที</p>

    <div style="display:flex;align-items:baseline;justify-content:space-between;border-bottom:2px solid var(--color-divider);padding-bottom:8px">
      <h6 style="margin:0;font-size:12px;letter-spacing:0.04em">ข้อมูลโครงการ</h6>
      <span style="font-family:var(--font-heading);font-weight:800;font-size:12px">{{ fieldCountLabel }}</span>
    </div>

    <sc-for list="{{ fields }}" as="f" hint-placeholder-count="7">
      <div class="field" style="padding:14px 0 0">
        <label for="{{ f.id }}" style="margin:0 0 5px;display:block;font-size:12px;color:color-mix(in srgb, var(--color-text) 70%, transparent)">{{ f.label }}</label>
        <input id="{{ f.id }}" class="input" value="{{ f.value }}" onChange="{{ f.onInput }}" placeholder="{{ f.placeholder }}" style="height:46px;font-size:15px;border-color:{{ f.border }}">
        <sc-if value="{{ f.bad }}" hint-placeholder-val="{{ false }}">
          <div style="font-size:12px;line-height:1.5;margin-top:5px;color:var(--color-accent-700)">{{ f.error }}</div>
        </sc-if>
      </div>
    </sc-for>

    <div style="margin-top:26px;display:flex;align-items:baseline;justify-content:space-between;border-bottom:2px solid var(--color-divider);padding-bottom:8px">
      <h6 style="margin:0;font-size:12px;letter-spacing:0.04em">แหล่งที่มาของเงิน</h6>
      <span style="font-family:var(--font-heading);font-weight:800;font-size:12px">3 ตัวเลือก</span>
    </div>
    <sc-for list="{{ funds }}" as="s" hint-placeholder-count="3">
      <label class="radio" style="width:100%;box-sizing:border-box;align-items:flex-start;padding:13px 12px;background:{{ s.bg }};border-bottom:1px solid color-mix(in srgb, var(--color-text) 18%, transparent);font-size:15px">
        <input type="radio" name="fund" checked="{{ s.checked }}" onChange="{{ s.pick }}">
        <span class="dot" style="margin-top:3px"></span>
        <span style="flex:1;min-width:0">
          <span style="display:block;font-family:var(--font-heading);font-weight:800;font-size:15px;line-height:1.35">{{ s.label }}</span>
          <span style="display:block;font-size:12.5px;line-height:1.55;margin-top:2px;color:color-mix(in srgb, var(--color-text) 55%, transparent)">{{ s.note }}</span>
        </span>
      </label>
    </sc-for>

    <div style="margin-top:26px;display:flex;align-items:baseline;justify-content:space-between;border-bottom:2px solid var(--color-divider);padding-bottom:8px">
      <h6 style="margin:0;font-size:12px;letter-spacing:0.04em">เพิ่มเติม</h6>
      <span style="font-family:var(--font-heading);font-weight:800;font-size:12px">ไม่บังคับ</span>
    </div>
    <button onClick="{{ toScan }}" style="width:100%;display:flex;align-items:center;gap:12px;padding:14px 0;background:transparent;border:0;border-bottom:1px solid color-mix(in srgb, var(--color-text) 18%, transparent);cursor:pointer;text-align:left;color:var(--color-text);font-family:var(--font-body)">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--color-accent-700)" stroke-width="2" stroke-linecap="square" style="flex:none"><path d="M12 16V4m0 0L7 9m5-5l5 5M4 17v3h16v-3"></path></svg>
      <span style="flex:1;min-width:0">
        <span style="display:block;font-size:14.5px;font-weight:600;line-height:1.45">แนบเอกสารโครงการ</span>
        <span style="display:block;font-size:12px;line-height:1.5;margin-top:2px;color:color-mix(in srgb, var(--color-text) 55%, transparent)">เช่น บันทึกขออนุมัติ หรือแผนการจัดซื้อ</span>
      </span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--color-neutral-700)" stroke-width="2.2" stroke-linecap="square" style="flex:none"><path d="M9 6l6 6-6 6"></path></svg>
    </button>
    <button onClick="{{ toggleMembers }}" style="width:100%;display:flex;align-items:center;gap:12px;padding:14px 0;background:transparent;border:0;border-bottom:1px solid color-mix(in srgb, var(--color-text) 18%, transparent);cursor:pointer;text-align:left;color:var(--color-text);font-family:var(--font-body)">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--color-accent-700)" stroke-width="2" stroke-linecap="square" style="flex:none"><circle cx="9" cy="8" r="4"></circle><path d="M2 20c0-3.3 3.1-5.5 7-5.5s7 2.2 7 5.5"></path><path d="M18 8h4m-2-2v4"></path></svg>
      <span style="flex:1;min-width:0">
        <span style="display:block;font-size:14.5px;font-weight:600;line-height:1.45">เพิ่มผู้ร่วมโครงการ</span>
        <span style="display:block;font-size:12px;line-height:1.5;margin-top:2px;color:color-mix(in srgb, var(--color-text) 55%, transparent)">{{ memberNote }}</span>
      </span>
      <span class="tag {{ memberTagClass }}" style="flex:none;font-size:11px">{{ memberTag }}</span>
    </button>
  </div>

  <div style="flex:none;border-top:2px solid var(--color-divider);padding:12px 16px;background:var(--color-bg)">
    <button onClick="{{ submit }}" disabled="{{ blocked }}" class="btn btn-primary" style="width:100%;justify-content:flex-start;height:52px;font-size:16px;padding-inline:16px">{{ submitLabel }}</button>
  </div>

  <sc-if value="{{ done }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;inset:0;z-index:60;background:var(--color-bg);display:flex;flex-direction:column;justify-content:center;padding:28px 20px">
      <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="var(--color-accent)" stroke-width="2.4" stroke-linecap="square"><path d="M4 12l5 5L20 6"></path></svg>
      <div style="font-family:var(--font-heading);font-weight:800;font-size:24px;line-height:1.3;letter-spacing:-0.01em;margin-top:18px">สร้างโครงการสำเร็จ</div>
      <p style="font-size:14px;line-height:1.65;margin-top:10px;color:color-mix(in srgb, var(--color-text) 62%, transparent)">{{ doneNote }}</p>
      <button onClick="{{ toProject }}" class="btn btn-secondary" style="justify-content:flex-start;height:48px;font-size:15px;padding-inline:16px;margin-top:8px">ไปที่โครงการ</button>
    </div>
  </sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
const FIELDS = [
  { key: 'name',   id: 'pName',   label: 'ชื่อโครงการ',      placeholder: 'เช่น จัดซื้ออุปกรณ์วิทยาศาสตร์' },
  { key: 'code',   id: 'pCode',   label: 'รหัสโครงการ',      placeholder: 'SCI-2026-000', pattern: /^[A-Z]{3}-\d{4}-\d{3}$/, error: 'รูปแบบต้องเป็น SCI-2026-000' },
  { key: 'owner',  id: 'pOwner',  label: 'ผู้รับผิดชอบ',      placeholder: 'ชื่อครูผู้รับผิดชอบ' },
  { key: 'detail', id: 'pDetail', label: 'รายละเอียดโครงการ', placeholder: 'อธิบายสั้น ๆ ว่าโครงการนี้ทำอะไร' },
  { key: 'budget', id: 'pBudget', label: 'งบประมาณ (บาท)',    placeholder: '360000' },
  { key: 'start',  id: 'pStart',  label: 'วันที่เริ่มต้น',     placeholder: 'วว/ดด/ปปปป' },
  { key: 'end',    id: 'pEnd',    label: 'วันที่สิ้นสุด',      placeholder: 'วว/ดด/ปปปป' },
];

const FUNDS = [
  { id: 'subsidy', label: 'เงินอุดหนุน',           note: 'งบที่ได้รับจัดสรรจากต้นสังกัด' },
  { id: 'income',  label: 'เงินรายได้สถานศึกษา',   note: 'รายได้ที่โรงเรียนจัดหาเอง' },
  { id: 'other',   label: 'เงินอื่น ๆ',            note: 'เงินบริจาคหรือแหล่งทุนภายนอก' },
];

class Component extends DCLogic {
  state = {
    v: { name: 'จัดซื้ออุปกรณ์วิทยาศาสตร์', code: 'SCI-2026-024', owner: 'ครูเบญจมาศ',
         detail: 'จัดซื้อกล้องจุลทรรศน์และอุปกรณ์ทดลองสำหรับห้องปฏิบัติการ',
         budget: '360000', start: '10/08/2026', end: '02/09/2026' },
    fund: 'subsidy',
    members: false,
    done: false,
  };

  renderVals() {
    const { v, fund, members } = this.state;

    const fields = FIELDS.map(f => {
      const val = v[f.key];
      const empty = !val.trim();
      const malformed = !!f.pattern && !empty && !f.pattern.test(val);
      const bad = empty || malformed;
      return {
        id: f.id, label: f.label, value: val, placeholder: f.placeholder,
        bad: bad,
        error: empty ? 'กรอก' + f.label + 'ก่อน' : (f.error || ''),
        border: bad ? 'var(--color-accent)' : 'var(--color-divider)',
        onInput: e => this.setState(s => ({ v: { ...s.v, [f.key]: e.target.value } })),
      };
    });

    const blocked = fields.some(f => f.bad);

    return {
      back: () => go('home'),
      fieldCountLabel: FIELDS.length + ' ช่อง',
      fields,

      funds: FUNDS.map(s => ({
        label: s.label, note: s.note,
        checked: s.id === fund,
        bg: s.id === fund ? 'var(--color-accent-100)' : 'transparent',
        pick: () => this.setState({ fund: s.id }),
      })),

      memberNote: members ? 'ครูสมชาย · ครูมาลี' : 'ยังไม่ได้เพิ่มใคร',
      memberTag: members ? '2 คน' : 'เพิ่ม',
      memberTagClass: members ? 'tag-neutral' : 'tag-outline',
      toggleMembers: () => this.setState(s => ({ members: !s.members })),
      toScan: () => go('scan'),

      blocked: blocked,
      submitLabel: blocked ? 'กรอกข้อมูลให้ครบก่อน' : 'สร้างโครงการ',
      submit: () => this.setState({ done: true }),

      done: this.state.done,
      doneNote: v.name + ' · ' + v.code + ' · งบประมาณ ฿' + Number(v.budget || 0).toLocaleString('en-US'),
      toProject: () => go('project'),
    };
  }
}
</script>
</body>
</html>
