<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/modernist-3270be51-2277-458c-bede-3d5623dd6fa7/styles.css">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;800&display=swap">
<script src="_ds/modernist-3270be51-2277-458c-bede-3d5623dd6fa7/_ds_bundle.js"></script>
<script src="flow.js"></script>
<style>:root{--font-body:"Archivo","Noto Sans Thai",system-ui,sans-serif;--font-heading:"Archivo","Noto Sans Thai",system-ui,sans-serif}</style>
</helmet>
<div style="height:100%;position:relative;overflow:hidden;display:flex;flex-direction:column;background:var(--color-bg);color:var(--color-text);font-family:var(--font-body)">

  <header style="flex:none;display:flex;align-items:center;gap:6px;padding:10px 14px;border-bottom:2px solid var(--color-divider);background:var(--color-bg)">
    <button onClick="{{ back }}" aria-label="ย้อนกลับ" style="width:44px;height:44px;margin-left:-10px;display:flex;align-items:center;justify-content:center;background:transparent;border:0;cursor:pointer;color:var(--color-text)">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="square"><path d="M15 5l-7 7 7 7"></path></svg>
    </button>
    <div style="flex:1;font-family:var(--font-heading);font-weight:800;font-size:15px;letter-spacing:-0.01em;line-height:1.1">ช่วยเหลือ</div>
  </header>

  <div style="flex:1;overflow:auto;padding:20px 16px 20px">
    <h1 style="font-size:25px;line-height:1.24;letter-spacing:-0.01em;margin:0 0 8px;text-wrap:pretty">วิธีใช้งาน KruScan</h1>
    <p style="font-size:13.5px;line-height:1.6;margin:0 0 22px;color:color-mix(in srgb, var(--color-text) 62%, transparent);text-wrap:pretty">สแกนครั้งเดียว ให้ AI จัดการงานเอกสาร คืนเวลาครูกลับสู่ห้องเรียน</p>

    <sc-for list="{{ steps }}" as="s" hint-placeholder-count="8">
      <div style="display:flex;gap:14px">
        <div style="width:28px;flex:none;display:flex;flex-direction:column;align-items:center">
          <span style="width:28px;height:28px;flex:none;background:{{ s.numBg }};color:{{ s.numColor }};display:flex;align-items:center;justify-content:center;font-family:var(--font-heading);font-weight:800;font-size:13px">{{ s.n }}</span>
          <span style="width:2px;flex:1;background:{{ s.rail }}"></span>
        </div>
        <div style="flex:1;min-width:0;padding-bottom:18px;margin-top:2px">
          <div style="font-family:var(--font-heading);font-weight:800;font-size:15.5px;line-height:1.3;letter-spacing:-0.01em">{{ s.label }}</div>
          <div style="font-size:12.5px;line-height:1.6;margin-top:4px;color:color-mix(in srgb, var(--color-text) 62%, transparent)">{{ s.note }}</div>
        </div>
      </div>
    </sc-for>

    <div style="margin-top:14px;border-top:2px solid var(--color-divider)">
      <div style="display:flex;align-items:baseline;justify-content:space-between;padding:16px 0 8px">
        <h6 style="margin:0;font-size:12px;letter-spacing:0.04em">คำถามที่พบบ่อย</h6>
        <span style="font-family:var(--font-heading);font-weight:800;font-size:12px">{{ faqCountLabel }}</span>
      </div>

      <sc-for list="{{ faqs }}" as="q" hint-placeholder-count="8">
        <button onClick="{{ q.toggle }}" style="width:100%;display:flex;align-items:center;gap:10px;padding:15px 0;background:transparent;border:0;border-bottom:2px solid var(--color-divider);cursor:pointer;text-align:left;color:var(--color-text);font-family:var(--font-body)">
          <span style="flex:1;min-width:0;font-family:var(--font-heading);font-weight:800;font-size:15px;line-height:1.35">{{ q.q }}</span>
          <span style="width:36px;height:36px;flex:none;display:flex;align-items:center;justify-content:center;color:var(--color-neutral-700)">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="square"><path d="{{ q.chevron }}"></path></svg>
          </span>
        </button>
        <sc-if value="{{ q.open }}" hint-placeholder-val="{{ false }}">
          <div style="padding:12px 0 16px;border-bottom:1px solid color-mix(in srgb, var(--color-text) 18%, transparent)">
            <p style="font-size:14px;line-height:1.7;margin:0;color:color-mix(in srgb, var(--color-text) 78%, transparent)">{{ q.a }}</p>
          </div>
        </sc-if>
      </sc-for>
    </div>

    <div style="margin-top:26px;border:2px solid var(--color-divider);padding:16px">
      <div style="font-family:var(--font-heading);font-weight:800;font-size:16px;line-height:1.35">ยังไม่พบคำตอบ?</div>
      <p style="font-size:13px;line-height:1.65;margin:6px 0 12px;color:color-mix(in srgb, var(--color-text) 62%, transparent)">ทีมสนับสนุนตอบกลับภายในวันทำการ จันทร์–ศุกร์ 08:30–16:30</p>
      <button onClick="{{ contact }}" class="btn btn-primary" style="width:100%;justify-content:flex-start;height:48px;font-size:15px;padding-inline:16px;gap:10px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M3 5h18v14H3z"></path><path d="M3 6l9 7 9-7"></path></svg>ติดต่อทีมสนับสนุน</button>
    </div>
  </div>

  <sc-if value="{{ contactOpen }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;inset:0;z-index:50;background:color-mix(in srgb, #201e1d 45%, transparent);display:flex;flex-direction:column;justify-content:flex-end">
      <div style="background:var(--color-bg);border-top:2px solid var(--color-text);display:flex;flex-direction:column">
        <div style="flex:none;display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:2px solid var(--color-divider)">
          <div style="font-family:var(--font-heading);font-weight:800;font-size:17px">ติดต่อทีมสนับสนุน</div>
          <button onClick="{{ closeAll }}" aria-label="ปิด" style="width:44px;height:44px;margin-right:-10px;background:transparent;border:0;cursor:pointer;color:var(--color-text);display:flex;align-items:center;justify-content:center">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="square"><path d="M5 5l14 14M19 5L5 19"></path></svg>
          </button>
        </div>
        <div style="padding:4px 16px 0">
          <sc-for list="{{ channels }}" as="c" hint-placeholder-count="3">
            <div style="display:flex;align-items:baseline;gap:12px;padding:14px 0;border-bottom:1px solid color-mix(in srgb, var(--color-text) 18%, transparent)">
              <span style="width:74px;flex:none;font-size:12px;line-height:1.5;color:color-mix(in srgb, var(--color-text) 70%, transparent)">{{ c.label }}</span>
              <span style="flex:1;min-width:0;font-size:14px;font-weight:600;line-height:1.45;text-align:right">{{ c.value }}</span>
            </div>
          </sc-for>
        </div>
        <div style="flex:none;padding:12px 16px;border-top:2px solid var(--color-divider)">
          <button onClick="{{ closeAll }}" class="btn btn-secondary" style="width:100%;justify-content:flex-start;height:48px;font-size:15px;padding-inline:16px">ปิด</button>
        </div>
      </div>
    </div>
  </sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
const STEPS = [
  { label: 'สร้างโครงการ',            note: 'ตั้งชื่อ รหัส งบประมาณ และแหล่งที่มาของเงิน' },
  { label: 'ถ่ายภาพหรืออัปโหลดเอกสาร', note: 'ถ่ายทีละใบหรือเลือกหลายไฟล์พร้อมกันก็ได้' },
  { label: 'AI อ่านเอกสาร',            note: 'อ่านได้ทั้งเอกสารพิมพ์และลายมือ' },
  { label: 'AI จำแนกข้อมูล',           note: 'แยกประเภทเอกสาร โครงการ แหล่งเงิน และครุภัณฑ์' },
  { label: 'AI ตรวจสอบความถูกต้อง',    note: 'เทียบยอดเงินข้ามเอกสารและหาข้อมูลที่ขัดกัน' },
  { label: 'แก้ไขข้อมูลที่ผิด',         note: 'พิมพ์แก้เองหรือสั่งด้วยเสียงก็ได้' },
  { label: 'ส่งออกไฟล์ Excel',         note: 'ได้ตาราง 13 คอลัมน์พร้อมส่งฝ่ายการเงิน' },
  { label: 'เสร็จสิ้น',                note: 'ข้อมูลถูกบันทึกเข้าโครงการเรียบร้อย' },
];

const FAQS = [
  { q: 'KruScan อ่านลายมือได้อย่างไร?',
    a: 'ระบบใช้ OCR ที่ฝึกกับเอกสารการเงินของโรงเรียนไทยโดยเฉพาะ จึงอ่านได้ทั้งเอกสารที่พิมพ์และที่เขียนด้วยลายมือ ทุกช่องที่อ่านได้จะแสดงเปอร์เซ็นต์ความมั่นใจกำกับไว้เสมอ ช่องที่ความมั่นใจต่ำกว่า 70% จะถูกทำเครื่องหมายสีแดงและต้องให้คนยืนยันก่อนส่งออก' },
  { q: 'ถ้า AI อ่านข้อมูลผิดต้องทำอย่างไร?',
    a: 'แตะที่ช่องนั้นได้เลย ระบบจะเปิดหน้าต่างแก้ไขขึ้นมาจากด้านล่าง พิมพ์ค่าที่ถูกต้องแล้วกดยืนยัน ทุกช่องแก้ไขได้ทั้งหมด ไม่มีช่องไหนที่ล็อกไว้' },
  { q: 'สามารถแก้ไขข้อมูลด้วยเสียงได้อย่างไร?',
    a: 'ในหน้าตรวจสอบข้อมูล กดปุ่ม “แก้ด้วยเสียง” แล้วพูดสิ่งที่ต้องการแก้ เช่น “เปลี่ยนจำนวนเป็น 10 ชิ้น” ระบบจะถอดความให้ดูก่อน แล้วจึงนำไปแก้ค่าในช่องที่เกี่ยวข้อง พร้อมคำนวณยอดรวมใหม่ให้อัตโนมัติ' },
  { q: 'รองรับเอกสารประเภทใดบ้าง?',
    a: 'ใบเสนอราคา ใบเสร็จรับเงิน ใบส่งของ ใบสำคัญรับเงิน ใบเบิกพัสดุ เอกสารเบิกจ่าย และเอกสารครุภัณฑ์ รับไฟล์ JPG PNG และ PDF' },
  { q: 'ประเภทการเบิก บจ. งด. ยจ. คืออะไร?',
    a: 'บจ. คือใบสำคัญจ่าย ใช้กับการจ่ายเงินให้ผู้ขายหรือผู้รับจ้าง · งด. คือใบเบิกงบดำเนินงาน ใช้กับค่าใช้จ่ายประจำ · ยจ. คือใบยืมเงินเพื่อจ่าย ที่ต้องล้างหนี้ภายหลัง ระบบจะจำแนกให้อัตโนมัติจากเนื้อหาในเอกสาร' },
  { q: 'ระบบจำแนกครุภัณฑ์อย่างไร?',
    a: 'ของที่มีมูลค่าต่อหน่วยเกิน ฿5,000 และใช้งานได้เกิน 1 ปี จะถูกจัดเป็นครุภัณฑ์ ต้องมีเลขครุภัณฑ์ หมวดหมู่ สถานที่จัดเก็บ ผู้รับผิดชอบ และ QR สำหรับติดตัวครุภัณฑ์ ส่วนของสิ้นเปลืองจะถูกจัดเป็นวัสดุ ซึ่งไม่ต้องลงทะเบียน หากระบบจำแนกผิดสามารถเปลี่ยนเองได้' },
  { q: 'สามารถส่งออกไฟล์อะไรได้บ้าง?',
    a: 'Excel (.xlsx) เป็นรูปแบบหลักที่แนะนำ นอกจากนี้ยังส่งออกเป็น CSV (.csv) และ Word (.docx) ได้ ทุกรูปแบบมีข้อมูลครบ 13 คอลัมน์เท่ากัน' },
  { q: 'ข้อมูลปลอดภัยหรือไม่?',
    a: 'บัญชีผูกกับหมายเลข API ของโรงเรียนและต้องยืนยันด้วยรหัส OTP ทุกครั้งที่เข้าสู่ระบบ ข้อมูลเอกสารเข้าถึงได้เฉพาะผู้ที่อยู่ในโครงการเท่านั้น' },
];

class Component extends DCLogic {
  state = { open: {}, contactOpen: false };

  renderVals() {
    const { open } = this.state;

    return {
      back: () => go('profile'),

      steps: STEPS.map((s, i) => ({
        n: i + 1,
        label: s.label,
        note: s.note,
        numBg: 'var(--color-accent)',
        numColor: 'var(--color-bg)',
        /* Last step has no successor, so its rail would dangle. */
        rail: i === STEPS.length - 1 ? 'transparent' : 'color-mix(in srgb, var(--color-text) 18%, transparent)',
      })),

      faqCountLabel: FAQS.length + ' ข้อ',
      faqs: FAQS.map((f, i) => ({
        q: f.q,
        a: f.a,
        open: !!open[i],
        chevron: open[i] ? 'M6 15l6-6 6 6' : 'M6 9l6 6 6-6',
        toggle: () => this.setState(s => ({ open: { ...s.open, [i]: !s.open[i] } })),
      })),

      channels: [
        { label: 'อีเมล',   value: 'support@kruscan.example' },
        { label: 'โทรศัพท์', value: '02-XXX-4471' },
        { label: 'เวลาทำการ', value: 'จันทร์–ศุกร์ 08:30–16:30' },
      ],
      contactOpen: this.state.contactOpen,
      contact: () => this.setState({ contactOpen: true }),
      closeAll: () => this.setState({ contactOpen: false }),
    };
  }
}
</script>
</body>
</html>
