<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/modernist-3270be51-2277-458c-bede-3d5623dd6fa7/styles.css">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;800&display=swap">
<script src="_ds/modernist-3270be51-2277-458c-bede-3d5623dd6fa7/_ds_bundle.js"></script>
<script src="flow.js"></script>
<style>:root{--font-body:"Archivo","Noto Sans Thai",system-ui,sans-serif;--font-heading:"Archivo","Noto Sans Thai",system-ui,sans-serif}</style>
</helmet>
<div style="height:100%;position:relative;overflow:hidden;display:flex;flex-direction:column;background:var(--color-bg);color:var(--color-text);font-family:var(--font-body)">

  <div style="flex:none;display:flex;align-items:center;gap:6px;padding:14px 6px 0">
    <button onClick="{{ back }}" aria-label="ย้อนกลับ" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:transparent;border:0;cursor:pointer;color:var(--color-text)">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="square"><path d="M15 5l-7 7 7 7"></path></svg>
    </button>
    <div style="font-family:var(--font-heading);font-weight:800;font-size:15px;letter-spacing:-0.01em">SchoolBackoffice <span style="color:var(--color-accent-700)">AI</span></div>
  </div>

  <div style="flex:1;overflow:auto;padding:28px 16px 18px">
    <h1 style="font-size:31px;line-height:1.2;letter-spacing:-0.015em;margin:0 0 10px;text-wrap:pretty">ยืนยันรหัส OTP</h1>
    <p style="font-size:14px;line-height:1.65;margin:0 0 28px;color:color-mix(in srgb, var(--color-text) 62%, transparent);text-wrap:pretty">กรอกรหัส 6 หลักที่ส่งไปยัง 08X-XXX-4471</p>

    <div style="display:flex;gap:8px">
      <sc-for list="{{ boxes }}" as="b" hint-placeholder-count="6">
        <div style="flex:1;height:58px;background:var(--color-surface);border:{{ b.border }};display:flex;align-items:center;justify-content:center;font-family:var(--font-heading);font-weight:800;font-size:24px;line-height:1">{{ b.char }}</div>
      </sc-for>
    </div>

    <div style="display:flex;align-items:center;gap:12px;margin-top:20px">
      <button onClick="{{ fill }}" class="btn btn-secondary" style="justify-content:flex-start;height:44px;font-size:14px;padding-inline:14px">{{ fillLabel }}</button>
      <button onClick="{{ clear }}" class="btn btn-ghost" style="height:44px;font-size:14px">ล้างรหัส</button>
    </div>

    <div style="margin-top:26px;border-top:2px solid var(--color-divider);padding-top:16px;display:flex;align-items:baseline;justify-content:space-between;gap:12px">
      <span style="font-size:13px;line-height:1.6;color:color-mix(in srgb, var(--color-text) 62%, transparent)">ยังไม่ได้รับรหัส?</span>
      <span style="font-size:13px;line-height:1.6;color:color-mix(in srgb, var(--color-text) 55%, transparent)">ขอรหัสใหม่ได้ใน 60 วินาที</span>
    </div>
  </div>

  <div style="flex:none;border-top:2px solid var(--color-divider);padding:12px 16px;background:var(--color-bg)">
    <button onClick="{{ submit }}" disabled="{{ incomplete }}" class="btn btn-primary" style="width:100%;justify-content:flex-start;height:52px;font-size:16px;padding-inline:16px">{{ submitLabel }}</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
const CODE = '402817';
const LEN = 6;

class Component extends DCLogic {
  state = { digits: '' };

  renderVals() {
    const { digits } = this.state;
    const incomplete = digits.length < LEN;

    return {
      boxes: Array.from({ length: LEN }, (_, i) => ({
        char: digits[i] || '',
        border: i === digits.length && incomplete
          ? '2px solid var(--color-accent)'
          : '1px solid var(--color-divider)',
      })),

      incomplete: incomplete,
      fillLabel: incomplete ? 'กรอกรหัสถัดไป' : 'กรอกครบแล้ว',
      fill: () => this.setState(s => ({ digits: CODE.slice(0, Math.min(s.digits.length + 1, LEN)) })),
      clear: () => this.setState({ digits: '' }),

      submitLabel: incomplete ? 'กรอกรหัสให้ครบ 6 หลัก' : 'ยืนยัน',
      submit: () => go('scan'),
      back: () => go('login'),
    };
  }
}
</script>
</body>
</html>
