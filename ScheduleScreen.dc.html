<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/modernist-3270be51-2277-458c-bede-3d5623dd6fa7/styles.css">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;800&display=swap">
<script src="_ds/modernist-3270be51-2277-458c-bede-3d5623dd6fa7/_ds_bundle.js"></script>
<script src="flow.js"></script>
<style>:root{--font-body:"Archivo","Noto Sans Thai",system-ui,sans-serif;--font-heading:"Archivo","Noto Sans Thai",system-ui,sans-serif}</style>
</helmet>
<div style="height:100%;position:relative;overflow:hidden;display:flex;flex-direction:column;background:var(--color-bg);color:var(--color-text);font-family:var(--font-body)">

  <header style="flex:none;display:flex;align-items:center;gap:6px;padding:10px 14px;border-bottom:2px solid var(--color-divider);background:var(--color-bg)">
    <div style="flex:1;font-family:var(--font-heading);font-weight:800;font-size:17px;letter-spacing:-0.01em;line-height:1.1">Kru<span style="color:var(--color-accent-700)">Scan</span></div>
    <button onClick="{{ toProfile }}" aria-label="โปรไฟล์" style="width:36px;height:36px;margin-right:-4px;background:var(--color-text);color:var(--color-bg);border:0;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:var(--font-heading);font-weight:800;font-size:13px">บ</button>
  </header>

  <div style="flex:1;overflow:auto;padding:20px 16px 24px">
    <h1 style="font-size:25px;line-height:1.24;letter-spacing:-0.01em;margin:0 0 6px;text-wrap:pretty">ภาพรวมโครงการ</h1>
    <p style="font-size:13.5px;line-height:1.6;margin:0 0 20px;color:color-mix(in srgb, var(--color-text) 62%, transparent)">โครงการจัดซื้ออุปกรณ์วิทยาศาสตร์ · SCI-2026-024</p>

    <div style="display:flex;align-items:center;gap:10px">
      <span style="flex:1;height:8px;background:var(--color-neutral-300);display:block">
        <span style="display:block;height:8px;width:68%;background:var(--color-accent)"></span>
      </span>
      <span style="flex:none;font-family:var(--font-heading);font-weight:800;font-size:15px">68%</span>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px">
      <sc-for list="{{ stats }}" as="s" hint-placeholder-count="4">
        <div style="border:2px solid var(--color-divider);padding:11px 12px 10px">
          <div style="font-family:var(--font-heading);font-weight:800;font-size:20px;line-height:1.15;color:{{ s.color }}">{{ s.value }}</div>
          <div style="font-size:11.5px;line-height:1.5;margin-top:5px;color:color-mix(in srgb, var(--color-text) 62%, transparent)">{{ s.label }}</div>
        </div>
      </sc-for>
    </div>

    <div style="margin-top:26px">
      <div style="display:flex;align-items:baseline;justify-content:space-between;border-bottom:2px solid var(--color-divider);padding-bottom:8px;margin-bottom:18px">
        <h6 style="margin:0;font-size:12px;letter-spacing:0.04em">ขั้นตอนการดำเนินงาน</h6>
        <span style="font-family:var(--font-heading);font-weight:800;font-size:12px">{{ taskCountLabel }}</span>
      </div>

      <sc-for list="{{ tasks }}" as="t" hint-placeholder-count="6">
        <div style="display:flex;gap:12px">
          <div style="width:14px;flex:none;display:flex;flex-direction:column;align-items:center">
            <span style="width:14px;height:14px;flex:none;background:{{ t.dotBg }};border:2px solid {{ t.dotBorder }}"></span>
            <span style="width:2px;flex:1;background:{{ t.rail }}"></span>
          </div>
          <div style="flex:1;min-width:0;padding-bottom:20px;margin-top:-3px">
            <div style="display:flex;align-items:flex-start;gap:10px">
              <div style="flex:1;min-width:0">
                <div style="font-family:var(--font-heading);font-weight:800;font-size:15.5px;line-height:1.3;letter-spacing:-0.01em">{{ t.name }}</div>
                <div style="font-size:12px;line-height:1.55;margin-top:4px;color:color-mix(in srgb, var(--color-text) 55%, transparent)">{{ t.dates }}</div>
              </div>
              <span class="tag {{ t.tagClass }}" style="flex:none;font-size:11px">{{ t.status }}</span>
            </div>
            <div style="display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-top:8px;font-size:11.5px;line-height:1.5;color:color-mix(in srgb, var(--color-text) 55%, transparent)">
              <span>{{ t.owner }}</span>
              <span>{{ t.docs }}</span>
            </div>
          </div>
        </div>
      </sc-for>
    </div>

    <div style="margin-top:4px;display:flex;align-items:center;gap:10px;border-left:4px solid var(--color-accent-2);padding:12px 14px;background:var(--color-accent-2-100)">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--color-accent-2-800)" stroke-width="2.2" stroke-linecap="square" style="flex:none"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 3"></path></svg>
      <span style="font-size:13.5px;line-height:1.5;color:var(--color-accent-2-800)">คาดว่าจะเสร็จ 20 ส.ค. 2026</span>
    </div>
  </div>

  <nav aria-label="เมนูหลัก" style="flex:none;display:flex;border-top:2px solid var(--color-text);background:var(--color-bg)">
    <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="3">
      <button onClick="{{ t.go }}" aria-label="{{ t.aria }}" aria-current="{{ t.current }}" style="flex:1;height:62px;margin-top:-2px;border:0;border-top:2px solid {{ t.rule }};background:transparent;cursor:pointer;color:{{ t.color }};display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-family:var(--font-heading);font-weight:800;font-size:11px;letter-spacing:0.02em">
        <sc-if value="{{ t.isHome }}" hint-placeholder-val="{{ true }}">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M3 11l9-7 9 7v9H3z"></path><path d="M10 20v-6h4v6"></path></svg>
        </sc-if>
        <sc-if value="{{ t.isSchedule }}" hint-placeholder-val="{{ false }}">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M3 5h18v16H3z"></path><path d="M3 10h18"></path><path d="M8 3v4M16 3v4"></path></svg>
        </sc-if>
        <sc-if value="{{ t.isProfile }}" hint-placeholder-val="{{ false }}">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><circle cx="12" cy="8" r="4"></circle><path d="M4 20c0-3.6 3.6-6 8-6s8 2.4 8 6"></path></svg>
        </sc-if>
        <span>{{ t.label }}</span>
      </button>
    </sc-for>
  </nav>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = {};

  tabsFor(here) {
    const T = [
      { key: 'home',     label: 'หน้าแรก',  aria: 'หน้าแรก' },
      { key: 'schedule', label: 'ตารางงาน', aria: 'ตารางงานของโครงการ' },
      { key: 'profile',  label: 'โปรไฟล์',  aria: 'บัญชีของฉัน' },
    ];
    return T.map(t => ({
      ...t,
      isHome: t.key === 'home',
      isSchedule: t.key === 'schedule',
      isProfile: t.key === 'profile',
      current: t.key === here ? 'page' : undefined,
      rule:  t.key === here ? 'var(--color-accent)' : 'transparent',
      color: t.key === here ? 'var(--color-accent-700)' : 'color-mix(in srgb, var(--color-text) 55%, transparent)',
      go: () => go(t.key),
    }));
  }

  renderVals() {
    const stats = [
      { value: '฿246,500', label: 'งบที่ใช้ไป จาก ฿360,000', color: 'var(--color-text)' },
      { value: '12',        label: 'เอกสารในโครงการ',          color: 'var(--color-text)' },
      { value: '2 / 6',     label: 'ขั้นตอนที่เสร็จแล้ว',       color: 'var(--color-accent-700)' },
      { value: '5 วัน',     label: 'เหลือถึงกำหนดส่ง',          color: 'var(--color-accent-2-800)' },
    ];

    /* tone: done | active | wait — drives marker, rail and tag together. */
    const tasks = [
      { name: 'ตั้งงบประมาณ',      tone: 'done',   status: 'เสร็จแล้ว',      dates: '10 – 15 ส.ค. 2026', owner: 'ครูเบญจมาศ', docs: '2 เอกสาร' },
      { name: 'ตรวจสอบแบบและราคา', tone: 'done',   status: 'เสร็จแล้ว',      dates: '15 – 16 ส.ค. 2026', owner: 'ครูสมชาย',   docs: '3 เอกสาร' },
      { name: 'จัดซื้อจัดจ้าง',     tone: 'active', status: 'กำลังดำเนินการ', dates: '17 – 20 ส.ค. 2026', owner: 'ครูเบญจมาศ', docs: '7 เอกสาร' },
      { name: 'เบิกจ่าย',           tone: 'wait',   status: 'รอดำเนินการ',    dates: '21 – 25 ส.ค. 2026', owner: 'ครูมาลี',    docs: 'ยังไม่มีเอกสาร' },
      { name: 'ล้างหนี้',           tone: 'wait',   status: 'รอดำเนินการ',    dates: '26 – 28 ส.ค. 2026', owner: 'ครูมาลี',    docs: 'ยังไม่มีเอกสาร' },
      { name: 'ส่งรายงาน',          tone: 'wait',   status: 'รอดำเนินการ',    dates: '29 ส.ค. – 2 ก.ย. 2026', owner: 'ครูเบญจมาศ', docs: 'ยังไม่มีเอกสาร' },
    ];

    const DOT_BG     = { done: 'var(--color-accent)', active: 'var(--color-bg)',       wait: 'var(--color-bg)' };
    const DOT_BORDER = { done: 'var(--color-accent)', active: 'var(--color-accent-2)', wait: 'var(--color-neutral-400)' };
    const TAG        = { done: 'tag-neutral',         active: 'tag-accent-2',          wait: 'tag-outline' };
    const done = tasks.filter(t => t.tone === 'done').length;

    return {
      tabs: this.tabsFor('schedule'),
      stats,
      taskCountLabel: done + ' / ' + tasks.length + ' เสร็จแล้ว',
      tasks: tasks.map((t, i) => ({
        ...t,
        dotBg: DOT_BG[t.tone],
        dotBorder: DOT_BORDER[t.tone],
        tagClass: TAG[t.tone],
        /* Last row has no successor, so its rail would dangle. */
        rail: i === tasks.length - 1 ? 'transparent' : 'color-mix(in srgb, var(--color-text) 18%, transparent)',
      })),
      toProfile: () => go('profile'),
    };
  }
}
</script>
</body>
</html>
